<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ketchup vs Mustard FPS</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#080d16;color:white;font-family:Arial,sans-serif}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:#101b2cdd;padding:12px 24px;border-radius:12px;font-weight:bold}#bottom{position:absolute;bottom:20px;left:20px;background:#101b2cdd;padding:14px;border-radius:12px;line-height:1.7}#feed{position:absolute;right:20px;top:75px;text-align:right}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;color:#fff}#overlay{position:fixed;inset:0;background:#07101feF;display:flex;align-items:center;justify-content:center;z-index:5}#panel{width:min(560px,92vw);padding:30px;background:#162339;border:1px solid #3d5270;border-radius:18px;text-align:center}button{background:#f4c52e;border:0;border-radius:9px;padding:13px 22px;font-size:17px;font-weight:bold;cursor:pointer;margin:8px}button.red{background:#e94242;color:white}#tip{font-size:14px;color:#bac8df;line-height:1.7}#message{position:absolute;top:25%;width:100%;text-align:center;font-size:30px;font-weight:bold;text-shadow:0 2px 8px #000}#damage{position:fixed;inset:0;background:#ff0000;opacity:0;pointer-events:none}#score{color:#f4ce57}</style></head><body><div id="hud"><div id="top"><span style="color:#ff5555">KETCHUP <span id="redScore">0</span></span> &nbsp; <span id="timer">1:30</span> &nbsp; <span style="color:#ffdc44">MUSTARD <span id="yellowScore">0</span></span></div><div id="cross">+</div><div id="message"></div><div id="feed"></div><div id="bottom">HP: <b id="hp">100</b> &nbsp; AMMO: <b id="ammo">30 / 120</b><br>Kills: <b id="kills">0</b> &nbsp; Deaths: <b id="deaths">0</b> &nbsp; Team: <b id="team">-</b></div></div><div id="damage"></div><div id="overlay"><div id="panel"><h1>🔫 KETCHUP vs MUSTARD</h1><p>Competitive 3D FPS • First to 5 rounds wins</p><p>Choose your team</p><button class="red" id="chooseRed">KETCHUP (RED)</button><button id="chooseYellow">MUSTARD (YELLOW)</button><p id="tip">WASD move • Mouse aim • Left click shoot • R reload • Shift sprint • Space jump<br>Click the game to lock your mouse. Esc pauses.</p><p id="score"></p></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script><script>
(()=>{'use strict';if(!window.THREE){document.getElementById('panel').insertAdjacentHTML('beforeend','<p style="color:#ff7777">3D engine could not load. Check your internet connection and refresh the page.</p>');return;}const scene=new THREE.Scene();scene.background=new THREE.Color(0x91a6c0);scene.fog=new THREE.Fog(0x91a6c0,28,90);const camera=new THREE.PerspectiveCamera(78,innerWidth/innerHeight,.07,130);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdbeaff,0x495b43,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(15,30,10);scene.add(sun);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat(0x516b5c));floor.rotation.x=-Math.PI/2;scene.add(floor);const walls=[];function block(x,z,w,d,h,color=0x697786){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,h/2,z);scene.add(m);walls.push({x,z,w,d});return m}block(0,-30,62,2,7);block(0,30,62,2,7);block(-30,0,2,62,7);block(30,0,2,62,7);[[-12,-11,8,4],[10,12,9,5],[-11,12,4,10],[12,-10,5,9],[0,0,7,7],[-22,0,4,8],[22,0,4,8],[0,-22,10,3],[0,22,10,3]].forEach((a,i)=>block(...a,i%2?0x596677:0x8a8172));for(let i=0;i<20;i++){let x=(i%5)*12-24,z=Math.floor(i/5)*13-20;const line=new THREE.Mesh(new THREE.BoxGeometry(1,.025,1),mat(0x647f69));line.position.set(x,.02,z);scene.add(line)}const gun=new THREE.Group();const barrel=new THREE.Mesh(new THREE.BoxGeometry(.12,.13,.72),mat(0x20262d));barrel.position.set(.28,-.25,-.65);gun.add(barrel);const grip=new THREE.Mesh(new THREE.BoxGeometry(.2,.24,.34),mat(0x333b45));grip.position.set(.27,-.33,-.28);gun.add(grip);camera.add(gun);scene.add(camera);const keys={},bots=[];let team=0,active=false,paused=true,hp=100,ammo=30,reserve=120,kills=0,deaths=0,red=0,yellow=0,remaining=90,last=performance.now(),fireTime=0,reloading=false,roundEnding=false,velocityY=0,grounded=true,yaw=0,pitch=0,spawnInvuln=0;const $=id=>document.getElementById(id);const player={x:0,z:0};const colors=[0xe33a38,0xf5d333];function collides(x,z,r=.55){return Math.abs(x)>28.7||Math.abs(z)>28.7||walls.some(b=>Math.abs(x-b.x)<b.w/2+r&&Math.abs(z-b.z)<b.d/2+r)}function move(o,dx,dz){if(!collides(o.x+dx,o.z))o.x+=dx;if(!collides(o.x,o.z+dz))o.z+=dz}function soldier(t){const g=new THREE.Group(),red=t===0;const shell=mat(red?0xd91522:0xf4c400),dark=mat(red?0x820713:0xa57800),black=mat(0x171b20),white=mat(0xffffff);function part(geo,m,x,y,z){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);g.add(o);return o}const body=part(new THREE.CylinderGeometry(.46,.49,1.42,12),shell,0,1.22,0);part(new THREE.CylinderGeometry(.48,.48,.16,12),dark,0,1.99,0);part(new THREE.ConeGeometry(.27,.48,12),shell,0,2.3,0);part(new THREE.BoxGeometry(.8,.14,.12),dark,0,1.77,-.39);for(const side of [-1,1]){part(new THREE.SphereGeometry(.125,10,8),white,side*.21,1.53,-.438);part(new THREE.SphereGeometry(.055,8,8),black,side*.21,1.53,-.55);const brow=part(new THREE.BoxGeometry(.29,.055,.07),black,side*.22,1.73,-.47);brow.rotation.z=side*.35;part(new THREE.BoxGeometry(.2,.7,.24),shell,side*.55,1.17,0);part(new THREE.BoxGeometry(.23,.54,.28),black,side*.22,.28,0)}part(new THREE.BoxGeometry(.48,.055,.08),black,0,1.28,-.49);part(new THREE.BoxGeometry(.72,.48,.13),dark,0,.91,-.46);part(new THREE.BoxGeometry(.8,.17,.3),black,0,.77,0);part(new THREE.BoxGeometry(.15,.16,.93),black,.2,1.18,-.58);part(new THREE.BoxGeometry(.08,.08,.34),black,.2,1.2,-1.18);scene.add(g);return g}function spawnBots(){bots.splice(0).forEach(()=>{});for(let i=0;i<9;i++){const t=i<4?team:1-team;const b={team:t,hp:100,x:0,z:0,alive:true,shoot:Math.random(),speed:2.2+Math.random()*.7,mesh:soldier(t)};bots.push(b)}}function spawnPos(t,i){return{x:(t===0?-21:21)+(i%3)*2.3,z:-14+Math.floor(i/3)*9}}function startRound(){roundEnding=false;remaining=90;hp=100;ammo=30;reserve=120;reloading=false;velocityY=0;grounded=true;spawnInvuln=2;const p=spawnPos(team,0);player.x=p.x;player.z=p.z;yaw=team===0?-Math.PI/2:Math.PI/2;pitch=0;bots.forEach((b,i)=>{let p=spawnPos(b.team,i+1);b.x=p.x;b.z=p.z;b.hp=100;b.alive=true;b.mesh.visible=true;b.mesh.position.set(b.x,0,b.z);b.shoot=Math.random()+.7});$('message').textContent='ROUND START';setTimeout(()=>{if(!roundEnding)$('message').textContent=''},1000);updateHud()}function updateHud(){$('hp').textContent=Math.max(0,Math.ceil(hp));$('ammo').textContent=ammo+' / '+reserve;$('kills').textContent=kills;$('deaths').textContent=deaths;$('redScore').textContent=red;$('yellowScore').textContent=yellow;$('team').textContent=team===0?'Ketchup':'Mustard';$('timer').textContent=Math.floor(remaining/60)+':'+String(Math.ceil(remaining%60)).padStart(2,'0')}function endRound(winner){if(roundEnding)return;roundEnding=true;if(winner===0)red++;else yellow++;$('message').textContent=(winner===0?'KETCHUP':'MUSTARD')+' WINS ROUND';updateHud();setTimeout(()=>{if(red>=5||yellow>=5){paused=true;active=false;document.exitPointerLock?.();$('overlay').style.display='flex';$('score').textContent=(red>=5?'KETCHUP':'MUSTARD')+' WINS THE MATCH! Choose a team to restart.'}else startRound()},2600)}function start(t){team=t;red=yellow=kills=deaths=0;bots.forEach(b=>scene.remove(b.mesh));spawnBots();active=true;paused=false;$('overlay').style.display='none';startRound();renderer.domElement.requestPointerLock?.()}$('chooseRed').onclick=()=>start(0);$('chooseYellow').onclick=()=>start(1);document.addEventListener('pointerlockchange',()=>{if(!active)return;paused=document.pointerLockElement!==renderer.domElement;$('overlay').style.display=paused?'flex':'none';if(paused)$('score').textContent='Paused — click Resume';else $('score').textContent=''});renderer.domElement.addEventListener('click',()=>{if(active&&paused)renderer.domElement.requestPointerLock?.()});document.addEventListener('mousemove',e=>{if(paused)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.45,Math.min(1.45,pitch-e.movementY*.0022))});document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='KeyR')reload()});document.addEventListener('keyup',e=>keys[e.code]=false);function reload(){if(reloading||ammo===30||reserve<=0||hp<=0)return;reloading=true;$('message').textContent='RELOADING';setTimeout(()=>{if(!active)return;const n=Math.min(30-ammo,reserve);ammo+=n;reserve-=n;reloading=false;if(!roundEnding)$('message').textContent='';updateHud()},1600)}const ray=new THREE.Raycaster();function shoot(){if(paused||roundEnding||hp<=0||reloading||ammo<=0||performance.now()-fireTime<125)return;fireTime=performance.now();ammo--;gun.position.z=.12;const direction=new THREE.Vector3();camera.getWorldDirection(direction);direction.x+=(Math.random()-.5)*.015;direction.y+=(Math.random()-.5)*.015;direction.normalize();ray.set(camera.position,direction);ray.far=65;const objects=[...bots.filter(b=>b.alive&&b.team!==team).flatMap(b=>b.mesh.children),...scene.children.filter(o=>o.isMesh&&o!==floor&&!bots.some(b=>b.mesh.children.includes(o)))];const hits=ray.intersectObjects(objects,false);if(hits.length){const hit=hits[0];const target=bots.find(b=>b.alive&&b.team!==team&&b.mesh.children.includes(hit.object));if(target){target.hp-=hit.object.geometry.type==='SphereGeometry'?85:35;if(target.hp<=0){target.alive=false;target.mesh.visible=false;kills++;$('feed').textContent='YOU eliminated Mustard/Ketchup bot';setTimeout(()=>$('feed').textContent='',1800)}}}updateHud()}document.addEventListener('mousedown',e=>{if(e.button===0)shoot()});function lineOfSight(a,b){const dx=b.x-a.x,dz=b.z-a.z;for(let s=1;s<20;s++){let f=s/20;if(collides(a.x+dx*f,a.z+dz*f,.05))return false}return true}function update(dt){remaining-=dt;if(remaining<=0){const ally=bots.filter(b=>b.alive&&b.team===team).length+(hp>0?1:0),enemy=bots.filter(b=>b.alive&&b.team!==team).length;endRound(ally>=enemy?team:1-team)}spawnInvuln=Math.max(0,spawnInvuln-dt);if(hp>0){let mx=Number(keys.KeyD)-Number(keys.KeyA),mz=Number(keys.KeyW)-Number(keys.KeyS),len=Math.hypot(mx,mz)||1,speed=keys.ShiftLeft?8:5.7;move(player,(Math.cos(yaw)*mx-Math.sin(yaw)*mz)/len*speed*dt,(-Math.sin(yaw)*mx-Math.cos(yaw)*mz)/len*speed*dt);if(keys.Space&&grounded){velocityY=6;grounded=false}velocityY-=16*dt;camera.position.y+=velocityY*dt;if(camera.position.y<=1.65){camera.position.y=1.65;velocityY=0;grounded=true}}camera.position.x=player.x;camera.position.z=player.z;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;gun.position.z+=(0-gun.position.z)*Math.min(1,dt*15);bots.forEach(b=>{if(!b.alive)return;const opponents=bots.filter(q=>q.alive&&q.team!==b.team);if(b.team!==team&&hp>0)opponents.push({x:player.x,z:player.z,player:true});const target=opponents.sort((a,c)=>Math.hypot(a.x-b.x,a.z-b.z)-Math.hypot(c.x-b.x,c.z-b.z))[0];if(!target)return;const dx=target.x-b.x,dz=target.z-b.z,dist=Math.hypot(dx,dz);b.mesh.rotation.y=Math.atan2(-dx,-dz);if(dist>5){const step=b.speed*dt;move(b,dx/dist*step,dz/dist*step)}b.mesh.position.set(b.x,0,b.z);b.shoot-=dt;if(dist<21&&b.shoot<=0&&lineOfSight(b,target)){b.shoot=.5+Math.random()*.6;if(target.player){if(spawnInvuln===0&&Math.random()<.55){hp-=8+Math.random()*9;$('damage').style.opacity='.25';if(hp<=0){hp=0;deaths++;$('message').textContent='ELIMINATED — spectating';}}}else if(Math.random()<.38){target.hp-=18;if(target.hp<=0){target.alive=false;target.mesh.visible=false}}}});if(hp<=0&&bots.filter(b=>b.alive&&b.team===team).length===0)endRound(1-team);else if(bots.filter(b=>b.alive&&b.team!==team).length===0)endRound(team);$('damage').style.opacity=Math.max(0,Number($('damage').style.opacity||0)-dt);updateHud()}function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(active&&!paused&&!roundEnding)update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}camera.position.y=1
